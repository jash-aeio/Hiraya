<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" role="img" aria-hidden="true">
  <!--
    Deliberately calm. This illustration appears at the worst moment of the
    worst day - a scanner at a gate with no signal - and its whole job is to say
    "held safely, will send", not "something has gone wrong". No red, no
    warning triangle, no severed cable: the queue is intact and the dashes are
    going up, not breaking.
  -->
