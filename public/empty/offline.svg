    <path d="M100 58V30"/>
  </g>
  <path d="M74 30a15 15 0 0 1 29-5 12 12 0 0 1 22 5 11 11 0 0 1-1 22H82a11 11 0 0 1-8-22Z" fill="#edeff4"/>
  <rect x="112" y="118" width="46" height="24" rx="12" fill="#f5a524"/>
